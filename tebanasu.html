<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>手放しステップ（単体）</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .flash {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:white;
    opacity:0;
    transition: opacity 0.5s;
    pointer-events:none;
  }
  #heart {
    width: 60px;
    height: 60px;
    background: #ff4d4d; /* 手放し前の濃い色 */
    clip-path: polygon(50% 0%, 61% 13%, 75% 13%, 88% 25%, 88% 38%, 75% 50%, 50% 75%, 25% 50%, 12% 38%, 12% 25%, 25% 13%, 39% 13%);
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<h2>手放しステップ（単体）</h2>

<!-- 手放し前のハート -->
<div id="heart"></div>

<!-- 読み上げ：誘導 -->
<button onclick="readGuide()">読み上げ（誘導）</button>

<hr>

<!-- 手放しボタン -->
<p><strong>今味わったね。一度、手放してみよっか？</strong></p>
<button onclick="release()">手放す</button>

<div class="flash" id="flash"></div>

<hr>

<!-- 手放し後の読み上げ -->
<button onclick="readAfter()">読み上げ（手放し後）</button>

<hr>

<!-- 記録 -->
<button onclick="saveRecord()">記録する</button>
<div id="log"></div>

<script>
function readGuide() {
  const text = "今味わったね。一度手放してみよっか。";
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function release() {
  const flash = document.getElementById("flash");
  const heart = document.getElementById("heart");

  // 白フラッシュ演出
  flash.style.opacity = 1;
  setTimeout(() => flash.style.opacity = 0, 500);

  // ハートの色を薄くする（簡易版）
  heart.style.background = "#ffb3b3";
}

function readAfter() {
  const text = "少し楽になってきてるね。手放せてるよ。";
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function saveRecord() {
  const log = document.getElementById("log");
  const item = document.createElement("p");
  item.textContent = "【記録】手放しを行いました（ハートの色が薄くなった）";
  log.appendChild(item);
}
</script>

</body>
</html>
