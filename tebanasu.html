<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>反芻を手放す簡易版（安定版）</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .flash {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:white;
    opacity:0;
    transition: opacity 0.5s;
    pointer-events:none;
  }
</style>
</head>
<body>

<h2>反芻を手放す簡易版（安定版）</h2>

<!-- ① 呼びかけ -->
<p><strong>それで、いまどう感じてる？</strong></p>

<!-- ② 感情（複数選択＋追加） -->
<label>感情（複数可）：</label><br>
<select id="emotion" multiple size="6">
  <option>怒り</option>
  <option>悲しみ</option>
  <option>不安</option>
  <option>イライラ</option>
  <option>孤独</option>
  <option>罪悪感</option>
</select>
<br>
<input type="text" id="emotionAdd" placeholder="感情を追加">
<button onclick="addEmotion()">追加</button>

<hr>

<!-- ③ ハート数値 -->
<label>不快感（0〜10）：</label>
<input type="number" id="heartBefore" min="0" max="10" value="6">

<hr>

<!-- ④ 読み上げ（感情＋ハート） -->
<button onclick="readEmotion()">読み上げる</button>

<hr>

<!-- ⑤ 言語化 -->
<label>どんな感じか、言語化してみて：</label><br>
<textarea id="describeText" rows="3" cols="40"></textarea>

<hr>

<!-- ⑥ 身体感覚（言語化） -->
<label>体のどの辺がどんな感じ？（例：胸の中央が冷たい／胃のあたりがぎゅっとする）</label><br>
<textarea id="bodyText" rows="3" cols="40"></textarea>

<hr>

<!-- ⑦ 最終まとめ読み上げ -->
<button onclick="readFinal()">全部まとめて読み上げる</button>

<hr>

<!-- ⑧ 手放し -->
<p><strong>今味わったね。一度、手放してみよっか？</strong></p>
<button onclick="release()">手放す</button>

<div class="flash" id="flash"></div>

<hr>

<!-- ⑨ 手放し後の数値 -->
<label>今の不快感（0〜10）：</label>
<input type="number" id="heartAfter" min="0" max="10" value="3">

<button onclick="readAfter()">変化を読み上げる</button>

<hr>

<!-- ⑩ 記録 -->
<button onclick="saveRecord()">記録する</button>

<div id="log"></div>

<script>
function addEmotion() {
  const add = document.getElementById("emotionAdd").value;
  if(add.trim() !== "") {
    const sel = document.getElementById("emotion");
    const op = document.createElement("option");
    op.textContent = add;
    sel.appendChild(op);
    document.getElementById("emotionAdd").value = "";
  }
}

function readEmotion() {
  const emotions = Array.from(document.getElementById("emotion").selectedOptions).map(o => o.value).join("、");
  const heart = document.getElementById("heartBefore").value;

  const text = `いまは、${emotions}を感じていて、不快感は${heart}くらいなんだね。`;

  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function readFinal() {
  const emotions = Array.from(document.getElementById("emotion").selectedOptions).map(o => o.value).join("、");
  const heart = document.getElementById("heartBefore").value;
  const desc = document.getElementById("describeText").value;
  const body = document.getElementById("bodyText").value;

  const text =
    `いまは${emotions}を感じていて、${desc}という感じで、体は「${body}」。不快感は${heart}だね。これを感じるのはありだよ。`;

  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function release() {
  const flash = document.getElementById("flash");
  flash.style.opacity = 1;
  setTimeout(() => flash.style.opacity = 0, 500);
}

function readAfter() {
  const before = document.getElementById("heartBefore").value;
  const after = document.getElementById("heartAfter").value;

  const text = `${before}から${after}に下がったね。不快感が少なくなってるよ。`;

  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function saveRecord() {
  const emotions = Array.from(document.getElementById("emotion").selectedOptions).map(o => o.value).join("、");
  const before = document.getElementById("heartBefore").value;
  const after = document.getElementById("heartAfter").value;

  const log = document.getElementById("log");
  const item = document.createElement("p");
  item.textContent = `【記録】感情：${emotions} / 不快感：${before}→${after}`;
  log.appendChild(item);
}
</script>

</body>
</html>
