<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>感情記録アプリ</title>

<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  flex-direction: column; /* ← 縦並びに変更 */
  align-items: center;    /* ← 中央寄せ */
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
  margin-bottom: 20px;
}

/* --- ハート部分 --- */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

.numbers {
  display: flex;
  justify-content: center;
  margin-top: 10px; /* ← ハートから少し離す */
}

.num-btn {
  width: 40px;
  height: 40px;
  margin: 4px;
  border: none;
  border-radius: 8px;
  background-color: #f5f5f5;
  color: #333;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
}


/* マウスを乗せたとき */
.num-btn:hover {
  background-color: #ffe0e0;
  /* transform を消す */
  /* transform: scale(1.1); */
}

.num-btn.active {
  background: #ff6b81;
  color: #fff;
}

/* --- セクション共通 --- */
.section {
  opacity: 0;
  transition: opacity 0.3s ease;
}

.section.visible {
  opacity: 1;
}


.section textarea,
.section input,
.section select {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
}
.emotion-btn {
  display: inline-block;
  margin: 4px;
  padding: 6px 12px;
  border: 1px solid #666;
  border-radius: 6px;
  cursor: pointer;
  background: #2b0149;
}
 .selected { background: #333; color: rgb(176, 77, 77); }

/* 出来事以下のブロック */
.section {
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
  width: 300px; /* ← 幅を固定して中央に */
}

.section.visible {
  opacity: 1;
  pointer-events: auto;
}

label, select, input {
  display: block; /* ← 横並びを解除して縦並びに */
  margin-bottom: 8px; /* ← 行間を少し空ける */
}

.guide-text {
  display: block;
  width: 90%;
  margin: 20px auto;
  padding: 12px 16px;
  background-color: #f8dada;
  color: #333;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  opacity: 1; /* ← 最初から見える */
  transition: opacity 0.8s ease;
}
.guide-text.fade-in {
  opacity: 1;
}
.guide-text {
  opacity: 0;
  transition: opacity 0.8s ease;
}
.tts-setting {
  display: grid;
  grid-template-columns: 120px 1fr; /* 左：ラベル / 右：入力 */
  grid-row-gap: 8px;
  grid-column-gap: 10px;
  align-items: center;
}

/* ラベルは右寄せにするとテーブル感が出る */
.tts-setting label {
  text-align: right;
}

/* 入力欄は幅をそろえる */
.tts-setting select,
.tts-setting input {
  width: 160px;
}
#releaseSlider {
  display: none;        /* ← 中央寄せのために block に */
  width: 80%;            /* ← 画面幅の8割。存在感アップ */
  max-width: 400px;      /* ← 大きすぎ防止（好みで調整） */
  margin: 20px auto;     /* ← 中央に配置＋上下余白 */
  height: 40px;          /* ← 太めにしてインパクト */
  accent-color: #ec9292; /* ← ハート色と統一 */
}

.heart-mask {
  transition: filter 0.8s ease; /* ← これだけ追加すればOK */
}

</style>
</head>

<body>



<div class="container">

  <!-- ハート -->
  <div class="heart-wrapper">
    <img src="heart-mask.png" class="heart-mask">
    <div class="black-curtain"></div>
  </div>

  <!-- 数字ボタン -->
  <div class="numbers">
<button class="num-btn" onclick="selectNum(event, 0)">0</button>
<button class="num-btn" onclick="selectNum(event, 1)">1</button>
<button class="num-btn" onclick="selectNum(event, 2)">2</button>
<button class="num-btn" onclick="selectNum(event, 3)">3</button>
<button class="num-btn" onclick="selectNum(event, 4)">4</button>
<button class="num-btn" onclick="selectNum(event, 5)">5</button>
<button class="num-btn" onclick="selectNum(event, 6)">6</button>
<button class="num-btn" onclick="selectNum(event, 7)">7</button>
<button class="num-btn" onclick="selectNum(event, 8)">8</button>
<button class="num-btn" onclick="selectNum(event, 9)">9</button>
<button class="num-btn" onclick="selectNum(event, 10)">10</button>
  </div>

<p id="releaseComment" style="display:none;"><strong>スライダーでハートを軽くして、気持ちを手放してください。</strong></p>

<input id="releaseSlider" 
       type="range" 
       min="0" max="10" step="1" value="10">

<div id="messageArea" class="guide-text fade-in">
  不快指数を入力してください
</div>
<audio id="announceAudio"></audio>

  <!-- 不快指数 -->
  <div style="margin-top:20px;">
    不快指数（0〜10）
    <input id="discomfort_input" type="number" min="0" max="10">

    <button onclick="setDiscomfortStart()">不快指数：始め</button>
    <button onclick="setDiscomfortEnd()">不快指数：終わり</button>
  </div>

  <!-- 読み上げに使う声（ID重複を避けるためここに1つだけ） -->
<div class="tts-setting">
  <label>声：</label>
  <select id="voiceSelect"></select>

  <label>読み上げスピード</label>
  <input id="voice_speed" type="number" min="0.5" max="2" step="0.1" value="1">
</div>


<!-- ここから出来事以下のブロック -->
  <div id="stepBlock" class="section">

    <!-- 出来事 -->
    <section>
        <label>出来事を入力してください</label>
      <textarea id="event"></textarea>
      <button onclick="readContent('event')">出来事を読み上げる</button>
    </section>

    <p><strong>どんな気持ちだった？選んでみて。</strong></p>
    <div id="emotionArea">
      <span class="emotion-btn" onclick="toggleEmotion(this)">怒り</span>
      <span class="emotion-btn" onclick="toggleEmotion(this)">不安</span>
      <span class="emotion-btn" onclick="toggleEmotion(this)">悲しみ</span>
      <span class="emotion-btn" onclick="toggleEmotion(this)">イライラ</span>
      <span class="emotion-btn" onclick="toggleEmotion(this)">孤独</span>
      <span class="emotion-btn" onclick="toggleEmotion(this)">罪悪感</span>
    </div>

    <input type="text" id="emotionAdd" placeholder="感情を追加">
    <button onclick="addEmotion()">追加</button>

    <hr>

    <!-- 小説のように気持ちを表現 -->
    <p><strong>その時の気持ちを、小説みたいに表現してみて？</strong></p>
    <textarea id="feelingText" rows="3"></textarea>

    <hr>

    <!-- 身体の変化 -->
    <p><strong>今この時を思い出して、体にはどんな変化があった？</strong></p>
    <textarea id="bodyText" rows="3"></textarea>

    <hr>


    <label>BGM：</label>
    <select id="bgmSelect">
      <option value="">なし</option>
      <option value="calm.mp3">落ち着く音</option>
      <option value="soft.mp3">やわらかい音</option>
    </select>

    <hr>

    <!-- 読み上げ -->
    <button onclick="readAll()">全部読み上げる</button>

    <button onclick="onAgree()">納得</button>

  </div><!-- stepBlock 終わり -->

</div><!-- container 終わり -->
</body>

<script>
function showGuide(text, mp3) {
  const msg = document.getElementById("messageArea");
  const audio = document.getElementById("announceAudio");

  msg.innerHTML = text;   // ← ここを innerHTML に変更！
  msg.classList.add("fade-in");

  setTimeout(() => {
    audio.src = mp3;
    audio.currentTime = 0;
    audio.play();
  }, 500);
}


function loadVoices() {
  voices = speechSynthesis.getVoices();
  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";

  let defaultIndex = 0;

  voices.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = v.name;
    select.appendChild(opt);

    if (v.lang.startsWith("ja") || v.name.includes("日本語")) {
      defaultIndex = i;
    }
  });

  select.value = defaultIndex;
}

loadVoices();                         // ← まず1回読み込む
speechSynthesis.onvoiceschanged = loadVoices;   // ← 声が本当に来たらもう1回読み込む




/*ハート*/
function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}


function selectNum(event, n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';

  document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  document.getElementById("discomfort_input").value = n;

  const guideText = `不快指数は ${n}ですね<br>次の質問に答えてください。`;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      showGuide(guideText, "henoj_2.mp3");
      document.getElementById("stepBlock").classList.add("visible");
    });
  });
}




function setDiscomfortStart() {
  const value = Number(document.getElementById("discomfort_input").value);
  discomfortStart = value;

  const msg = `不快指数は${value}ですね。<br>振り返りながら次の質問に答えてください。`;
  const utter = new SpeechSynthesisUtterance(msg);
  utter.rate = Number(document.getElementById("voice_speed").value);
  utter.voice = voices[document.getElementById("voiceSelect").value];

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);

  utter.onend = () => {
    document.getElementById("stepBlock").classList.add("visible");
  };
}

/*気持ちのセレクト*/
let selectedEmotions = [];

function toggleEmotion(el) {
  const emotion = el.textContent;
  if (selectedEmotions.includes(emotion)) {
    selectedEmotions = selectedEmotions.filter(e => e !== emotion);
    el.classList.remove("selected");
  } else {
    selectedEmotions.push(emotion);
    el.classList.add("selected");
  }
}

function addEmotion() {
  const add = document.getElementById("emotionAdd").value.trim();
  if (add) {
    const area = document.getElementById("emotionArea");
    const span = document.createElement("span");
    span.className = "emotion-btn";
    span.textContent = add;
    span.onclick = function() { toggleEmotion(span); };
    area.appendChild(span);
    document.getElementById("emotionAdd").value = "";
  }
}


let hasPlayedGuide = false;  // ★ 一回目かどうか判定するフラグ

function readAll() {
  const event = document.getElementById("event").value;
  const emotions = selectedEmotions.join("、");
  const feeling = document.getElementById("feelingText").value;
  const body = document.getElementById("bodyText").value;

  const rate = Number(document.getElementById("voice_speed").value);
  const voiceIndex = document.getElementById("voiceSelect").value;

  const text =
    `${event}といった出来事がきっかけで、${emotions}を感じていて、${feeling}という気持ちがあって、身体感覚は${body}」ですね。`;

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = rate;
  utter.voice = voices[voiceIndex];

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);

  // ★★★ 読み上げが終わったら実行される処理 ★★★
  utter.onend = function() {

    if (!hasPlayedGuide) {
      // 一回目だけ流す案内音声
      showGuide("繰り返し聞いてください", "tugihe.mp3");

      // ★ ボタンの言葉を「もう一度」に変更
      const btn = document.getElementById("readAllButton");
      if (btn) btn.textContent = "もう一度";

      hasPlayedGuide = true;  // 次回からは別の案内へ

    } else {
      // 二回目以降の案内（音声はまだ作っていないとのことなのでメッセージだけ）
      showGuide("必要に応じて内容を変えたり<br>不快指数の数値の変更をしてください。","repeat2.mp3");

      // 音声を作ったらここに追加
      // showGuide("もう一度聞きますか？", "repeat2.mp3");
    }
  };
}

function onAgree() {
  const slider = document.getElementById("releaseSlider");
  const numbers = document.querySelector('.numbers');
  const questions = document.querySelector('#stepBlock'); // 質問欄
  const readAll = document.querySelector('.read-all'); // 全体を読む欄
  const heart = document.querySelector('.heart-wrapper');

  // 数字ボタン・質問欄・全体を読むを消す
  if (numbers) numbers.style.display = "none";
  if (questions) questions.style.display = "none";
  if (readAll) readAll.style.display = "none";

  // スライダーを表示
  slider.style.display = "block";

  // ハートの位置へスクロール（目線を上へ）
  heart.scrollIntoView({ behavior: "smooth", block: "center" });

  // ハートを少しだけ拡大して視線誘導
  heart.style.transition = "transform 0.3s ease";
  heart.style.transform = "scale(1.1)";
  setTimeout(() => {
    heart.style.transform = "scale(1.0)";
  }, 300);

  // アナウンス欄を上に表示
  showGuide("バーを動かしてハートをクリーンにしてください", "henoj_2.mp3");
}


/* 手放しステップ：納得ボタンを押したらスライダーを表示 */
function releaseHeart(n) {
  const curtain = document.querySelector('.black-curtain');
  const heart = document.querySelector('.heart-mask');   // PNGの枠線
  const wrapper = document.querySelector('.heart-wrapper');
  const body = document.body;

  // 黒幕の高さを減らす
  curtain.style.height = (n * 10) + '%';

  // 0になったら黄色ハート＋白枠演出
  if (n == 0) {

    // 黒幕をふわっと消す
    curtain.style.transition = "opacity 0.8s ease";
    curtain.style.opacity = "0";

    // 🌼 枠線（PNG）を白に見せる
    heart.style.transition = "filter 0.8s ease";
    heart.style.filter = "brightness(300%) saturate(0%)";

    // 🌼 ハートの中だけ黄色にする（背景色）
    wrapper.style.transition = "background 0.8s ease";
    wrapper.style.background = "#fff27a"; // レモン色

    // 🌼 全体の背景は白
    body.style.background = "#ffffff";

    // 黒幕を完全に消す
    setTimeout(() => {
      curtain.style.display = "none";
    }, 800);
  }
}


/* スライダーと連動 */
document.getElementById("releaseSlider").addEventListener("input", e => {
  releaseHeart(e.target.value);
});


</script>

</html>
