<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Test</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }

  .container {
    width: 300px;
    text-align: center;
  }

  .heart-wrapper {
    width: 140px;
    height: 140px;
    margin: 0 auto;
    position: relative;
  }

  .heart-svg {
    width: 100%;
    height: 100%;
  }

  /* 黒レイヤーのアニメーション */
  #black-layer {
    transition: height 0.3s ease;
  }

  .numbers {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  .num-btn {
    width: 28px;
    height: 28px;
    background: #333;
    border-radius: 6px;
    text-align: center;
    line-height: 28px;
    cursor: pointer;
  }

  .num-btn.active {
    background: #666;
  }
</style>
</head>

<body>
<div class="container">

  <div class="heart-wrapper">
    <svg id="heart-svg" viewBox="0 0 100 100" class="heart-svg">
      <!-- 白いハート本体 -->
      <path id="heart-path"
        d="M50 85 L20 55 A20 20 0 1 1 50 30 A20 20 0 1 1 80 55 Z"
        fill="white">
      </path>

      <!-- 黒レイヤー（半透明） -->
      <rect id="black-layer"
        x="0" y="100" width="100" height="0"
        fill="black" opacity="0.5">
      </rect>
    </svg>
  </div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<script>
  const blackLayer = document.getElementById("black-layer");

  function selectNum(n) {
    const percent = n * 10; // 0〜100%

    blackLayer.setAttribute("y", 100 - percent);
    blackLayer.setAttribute("height", percent);

    const btns = document.querySelectorAll('.num-btn');
    btns.forEach(btn => btn.classList.remove('active'));
    btns[n].classList.add('active');
  }
</script>

</body>
</html>
