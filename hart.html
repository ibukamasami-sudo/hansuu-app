<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #111;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: transparent; /* ← ここだけ修正 */
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;

  mask-image: url('heart-mask.png');
  mask-size: 100% 100%;   /* ← ここが決定的 */
  mask-repeat: no-repeat;
  mask-position: center;
  transition: height 0.3s ease;
}

.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #666;
}


</style>
</head>

<body>
<div class="container">

<div class="heart-wrapper">
  <div class="black-curtain"></div>
</div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<script>

function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}

</script>


</body>
</html>
