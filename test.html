<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Test</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }

  .container {
    width: 300px;
    text-align: center;
  }

  .heart-wrapper {
    width: 140px;
    height: 140px;
    margin: 0 auto;
  }

  .heart-svg {
    width: 100%;
    height: 100%;
  }

  .numbers {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
  }

  .num-btn {
    width: 28px;
    height: 28px;
    background: #333;
    border-radius: 6px;
    text-align: center;
    line-height: 28px;
    cursor: pointer;
  }

  .num-btn.active {
    background: #666;
  }
</style>
</head>

<body>
<div class="container">

  <div class="heart-wrapper">
    <svg id="heart-svg" viewBox="0 0 100 85" class="heart-svg">
      <path id="heart-path"
        d="M50 85 L20 55 A20 20 0 1 1 50 30 A20 20 0 1 1 80 55 Z"
        fill="white">
      </path>
    </svg>
  </div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<script>
  const heartPath = document.getElementById("heart-path");

  function selectNum(n) {
    // 0 → 白、10 → 黒
    const gray = 255 - n * 25; // 白→黒の直線的な変化
    heartPath.setAttribute("fill", `rgb(${gray},${gray},${gray})`);

    const btns = document.querySelectorAll('.num-btn');
    btns.forEach(btn => btn.classList.remove('active'));
    btns[n].classList.add('active');
  }
</script>

</body>
</html>
