<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292; /* ← ほんのり薄ピンク */
  overflow: hidden;

  /* ここから追加 */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハート画像は固定・前面 */
.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2; /* 前面に固定 */
}

/* 黒い幕は背面で上昇 */
.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1; /* 背面に配置 */
  transition: height 0.3s ease;
}


.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #666;
}

.nav-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #333;
  color: #eee;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
.nav-btn:hover {
  background: #555;
}

.index-btn {
  display: inline-block;
  width: 32px;
  height: 32px;
  margin: 4px;
  background: #444;
  color: #eee;
  border-radius: 6px;
  text-align: center;
  line-height: 32px;
  cursor: pointer;
}
.index-btn:hover {
  background: #666;
}

</style>
</head>

<body>
<div class="container">

<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask" alt="">
  <div class="black-curtain"></div>
</div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<!-- ▼ ナビゲーター選択欄 ▼ -->
<div id="navigatorSelect" style="margin-top:20px;">
  <p>ナビゲーターを選択してください。</p>

  <button class="nav-btn" onclick="selectNavigator('henoj')">変なおじさん</button>
  <button class="nav-btn" onclick="selectNavigator('sensei')">男性教諭</button>
  <button class="nav-btn" onclick="selectNavigator('onei')">おねえ</button>
  <button class="nav-btn" onclick="selectNavigator('mama')">ママ</button>
</div>

<!-- ▼ ナビゲーターの質問表示欄 ▼ -->
<div id="navigatorText" style="margin-top:20px; font-size:16px;"></div>

<!-- ▼ 不快指数（最初は非表示） ▼ -->
<div id="indexSection" style="margin-top:20px; display:none;">
  <p>1〜10までの不快の度合いを選んで。</p>

  <div id="indexButtons"></div>
</div>

<script>

function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}

function toggleHeart() {
  const wrapper = document.querySelector('.heart-wrapper');
  const btn = document.getElementById('hideHeartBtn');

  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'flex';
    btn.textContent = 'ハートを非表示にする';
  } else {
    wrapper.style.display = 'none';
    btn.textContent = 'ハートを表示する';
  }
}

function selectNavigator(type) {
  let voiceFile = "";

  switch(type) {
    case "henoj":
      voiceFile = "henoj_1.mp3";
      break;
    case "sensei":
      voiceFile = "sensei_1.mp3";
      break;
    case "onei":
      voiceFile = "onei_1.mp3";
      break;
    case "mama":
      voiceFile = "mama_1.mp3";
      break;
  }

  // ▼ MP3を再生
  new Audio(voiceFile).play();

  // ▼ 質問を表示
  document.getElementById("navigatorText").textContent =
    "今の不快の度合いを教えて？";

  // ▼ 不快指数ボタンを表示
  document.getElementById("indexSection").style.display = "block";

  // ▼ ボタンを生成（1〜10）
  const container = document.getElementById("indexButtons");
  container.innerHTML = "";
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement("div");
    btn.className = "index-btn";
    btn.textContent = i;

    btn.onclick = function() {
      onSelectIndex(i);
    };

    container.appendChild(btn);
  }
}

function onSelectIndex(value) {
  // ▼ 次の質問へ
  document.getElementById("navigatorText").textContent =
    `不快指数 ${value} ね。何があったの？ここに描き出して？`;

  // ▼ この後に出来事入力欄を表示する（次のステップで作る）
}


</script>


</body>
</html>
