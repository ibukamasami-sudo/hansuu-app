<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292; /* ← ほんのり薄ピンク */
  overflow: hidden;

  /* ここから追加 */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハート画像は固定・前面 */
.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2; /* 前面に固定 */
}

/* 黒い幕は背面で上昇 */
.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1; /* 背面に配置 */
  transition: height 0.3s ease;
}


.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #666;
}

.nav-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #333;
  color: #eee;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
.nav-btn.selected {
  background: #0066cc;
}

.index-btn {
  display: inline-block;
  width: 32px;
  height: 32px;
  margin: 4px;
  background: #444;
  color: #eee;
  border-radius: 6px;
  text-align: center;
  line-height: 32px;
  cursor: pointer;
}
.index-btn:hover {
  background: #666;
}

</style>
</head>

<body>
<div class="container">

<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask" alt="">
  <div class="black-curtain"></div>
</div>

<!-- ▼ ナビゲーター選択 ▼ -->
<div id="navigatorSelect" style="margin-top:20px;">
  <p>ナビゲーターを選択してください。</p>

  <button class="nav-btn" onclick="selectNavigator('henoj')">変なおじさん</button>
  <button class="nav-btn" onclick="selectNavigator('sensei')">男性教諭</button>
  <button class="nav-btn" onclick="selectNavigator('onei')">おねえ</button>
  <button class="nav-btn" onclick="selectNavigator('mama')">ママ</button>
</div>

<!-- ▼ 質問表示欄 ▼ -->
<div id="navigatorText" style="margin-top:20px; font-size:16px;"></div>

<!-- ▼ 不快指数（最初は非表示） ▼ -->
<div id="indexSection" style="margin-top:20px; display:none;">
  <div id="indexButtons"></div>
</div>

<!-- ▼ 出来事入力欄（最初は非表示） ▼ -->
<div id="eventSection" style="margin-top:20px; display:none;">
  <textarea id="eventInput" rows="4" style="width:100%;"></textarea>

  <button id="readEventBtn">読み上げる</button>
</div>

<!-- ▼ 気持ち選択欄（最初は非表示） ▼ -->
<div id="emotionSection" style="margin-top:20px; display:none;">
  <p>その時の気持ちを選んでね。</p>
  <select id="emotionSelect">
    <option value="">選択してください</option>
    <option value="怒り">怒り</option>
    <option value="悲しみ">悲しみ</option>
    <option value="不安">不安</option>
    <option value="後悔">後悔</option>
    <option value="混乱">混乱</option>
    <option value="孤独">孤独</option>
  </select>
</div>


<script>

let currentNavigator = "";
let step = 1;

// ▼ ナビゲーター選択
function selectNavigator(type) {
  currentNavigator = type;

  // ボタン色変更
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('selected'));
  event.target.classList.add('selected');

  // 質問1の音声
  new Audio(`${currentNavigator}_1.mp3`).play();

  // 質問表示
  document.getElementById("navigatorText").textContent =
    "どんだけ不愉快なのか教えて？";

  // 不快指数ボタン表示
  showIndexButtons();
}

// ▼ 不快指数ボタン生成
function showIndexButtons() {
  const container = document.getElementById("indexButtons");
  container.innerHTML = "";
  document.getElementById("indexSection").style.display = "block";

  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement("div");
    btn.className = "index-btn";
    btn.textContent = i;

    btn.onclick = function() {
      onSelectIndex(i);
    };

    container.appendChild(btn);
  }
}

// ▼ 数字を押した時
function onSelectIndex(value) {
  // 質問2の音声
  new Audio(`${currentNavigator}_2.mp3`).play();

  document.getElementById("navigatorText").textContent =
    "何があったのか教えて？";

  // 出来事入力欄を表示
  document.getElementById("eventSection").style.display = "block";
}

// ▼ 読み上げボタン
document.getElementById("readEventBtn").onclick = function() {
  const text = document.getElementById("eventInput").value;

  const utter = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);

  // 質問3の音声
  new Audio(`${currentNavigator}_3.mp3`).play();

  // 気持ち選択欄を表示
  document.getElementById("emotionSection").style.display = "block";

  document.getElementById("navigatorText").textContent =
    "その時の気持ちを選んでね。";
};


</script>


</body>
</html>
