<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スマホ対応・音声選択</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  select { font-size: 18px; padding: 8px; width: 100%; }
  button { margin-top: 20px; padding: 10px; font-size: 18px; }
</style>
</head>
<body>

<h2>スマホでも確実に声を選べる読み上げ</h2>

<select id="voiceSelect"></select>
<textarea id="text" rows="5" style="width:100%; margin-top:20px;">こんにちは、Masamiさん。</textarea>
<button onclick="speak()">読み上げる</button>

<script>
function loadVoicesSmart() {
    const synth = window.speechSynthesis;
    let voices = synth.getVoices();

    // スマホは getVoices() が遅延するため、再取得を試みる
    if (!voices.length) {
        setTimeout(loadVoicesSmart, 300);
        return;
    }

    // 実際に読み上げできる声だけを残す
    const usableVoices = voices.filter(v => {
        return v.lang && (v.lang.includes("ja") || v.lang.includes("JP"));
    });

    // スマホは日本語が1種類しかないことが多いので補正
    let finalVoices = usableVoices.length ? usableVoices : voices;

    const select = document.getElementById("voiceSelect");
    select.innerHTML = "";

    finalVoices.forEach((v, i) => {
        const option = document.createElement("option");
        option.value = i;

        // 名前が空欄のスマホ対策
        const label = v.name ? v.name : `日本語音声 (${v.lang})`;
        option.textContent = label;

        select.appendChild(option);
    });
}

function speak() {
    const text = document.getElementById("text").value;
    const voiceIndex = document.getElementById("voiceSelect").value;

    const utter = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();

    // スマホ用補正
    const usableVoices = voices.filter(v => v.lang.includes("ja") || v.lang.includes("JP"));
    const finalVoices = usableVoices.length ? usableVoices : voices;

    utter.voice = finalVoices[voiceIndex];
    utter.rate = 1.0;
    utter.pitch = 1.0;

    speechSynthesis.speak(utter);
}

window.speechSynthesis.onvoiceschanged = loadVoicesSmart;
loadVoicesSmart();
</script>

</body>
</html>
