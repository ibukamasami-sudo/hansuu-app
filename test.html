<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292; /* ← ほんのり薄ピンク */
  overflow: hidden;

  /* ここから追加 */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハート画像は固定・前面 */
.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2; /* 前面に固定 */
}

/* 黒い幕は背面で上昇 */
.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1; /* 背面に配置 */
  transition: height 0.3s ease;
}


.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #666;
}


</style>
</head>

<body>
<div class="container">

<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask" alt="">
  <div class="black-curtain"></div>
</div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<!-- ← この下に非表示ボタンを置く -->
<button id="hideHeartBtn" onclick="toggleHeart()">ハートを非表示にする</button>

<script>

function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}

function toggleHeart() {
  const wrapper = document.querySelector('.heart-wrapper');
  const btn = document.getElementById('hideHeartBtn');

  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'flex';
    btn.textContent = 'ハートを非表示にする';
  } else {
    wrapper.style.display = 'none';
    btn.textContent = 'ハートを表示する';
  }
}

</script>


</body>
</html>
