<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

/* ハート */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

/* 数字ボタン（最初は非表示） */
.numbers {
  display: none;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

/* ナビゲーター */
.nav-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #333;
  color: #eee;
  border-radius: 6px;
  cursor: pointer;
}

.nav-btn.selected {
  background: #0066cc;
}


</style>
</head>
<body>
<div class="container">

  <!-- ハート -->
  <div class="heart-wrapper">
    <img src="heart-mask.png" class="heart-mask">
    <div class="black-curtain"></div>
  </div>

  <!-- 数字ボタン（最初は非表示） -->
  <div class="numbers">
    <div class="num-btn" onclick="handleIndex(0)">0</div>
    <div class="num-btn" onclick="handleIndex(1)">1</div>
    <div class="num-btn" onclick="handleIndex(2)">2</div>
    <div class="num-btn" onclick="handleIndex(3)">3</div>
    <div class="num-btn" onclick="handleIndex(4)">4</div>
    <div class="num-btn" onclick="handleIndex(5)">5</div>
    <div class="num-btn" onclick="handleIndex(6)">6</div>
    <div class="num-btn" onclick="handleIndex(7)">7</div>
    <div class="num-btn" onclick="handleIndex(8)">8</div>
    <div class="num-btn" onclick="handleIndex(9)">9</div>
    <div class="num-btn" onclick="handleIndex(10)">10</div>
  </div>

</div>

<!-- ナビゲーター選択 -->
<div id="navigatorSelect" style="margin-top:20px;">
  <p>ナビゲーターを選択してください。</p>

  <button class="nav-btn" onclick="selectNavigator(this,'henoj')">変なおじさん</button>
  <button class="nav-btn" onclick="selectNavigator(this,'sensei')">男性教諭</button>
  <button class="nav-btn" onclick="selectNavigator(this,'onei')">おねえ</button>
  <button class="nav-btn" onclick="selectNavigator(this,'mama')">ママ</button>
</div>

<!-- 質問表示 -->
<div id="navigatorText" style="margin-top:20px; font-size:16px;"></div>

<!-- 出来事入力欄 -->
<div id="eventSection" style="margin-top:20px; visibility:hidden;">
  <p>何があったのか、ここに描き出してみて。</p>
  <textarea id="eventInput" rows="4" style="width:100%;"></textarea>

  <div style="margin-top:10px;">
    <label>声：</label>
    <select id="voiceSelect"></select>

    <label>速さ：</label>
    <input type="range" id="rateSelect" min="0.5" max="2" step="0.1" value="1">
  </div>

  <button id="readEventBtn">読み上げる</button>
</div>

<!-- 気持ち選択 -->
<div id="emotionSection" style="margin-top:20px; visibility:hidden;">
  <p>その時の気持ちを選んでね。</p>
  <select id="emotionSelect">
    <option value="">選択してください</option>
    <option value="怒り">怒り</option>
    <option value="悲しみ">悲しみ</option>
    <option value="不安">不安</option>
    <option value="後悔">後悔</option>
    <option value="混乱">混乱</option>
    <option value="孤独">孤独</option>
  </select>
</div>


<script>

let currentNavigator = "";

/* ハートの黒幕（既存機能） */
function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}

/* ナビゲーター選択（質問1だけ再生） */
function selectNavigator(btn, type) {
  currentNavigator = type;

  // ボタン色変更
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  // 質問1の音声（ここは安全）
  new Audio(`${currentNavigator}_1.mp3`).play();

  // 質問表示
  document.getElementById("navigatorText").textContent =
    "どんだけ不愉快なのか教えて？";

  // 数字ボタン表示
  document.querySelector('.numbers').style.display = "flex";
}

/* 数字を押したとき（質問2だけ再生） */
function handleIndex(n) {
  selectNum(n);

  // 質問2の音声（ここも安全）
  new Audio(`${currentNavigator}_2.mp3`).play();

  document.getElementById("navigatorText").textContent =
    "何があったのか教えて？";

  document.getElementById("eventSection").style.display = "block";
}

/* 声一覧読み込み */
function loadVoices() {
  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";
  const voices = speechSynthesis.getVoices();

  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name;
    select.appendChild(opt);
  });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

/* 読み上げ処理（完全安定版） */
function speakText(text, rate, voiceName) {
  let voices = speechSynthesis.getVoices();

  // 声がまだ読み込まれていない場合は再試行
  if (!voices || voices.length === 0) {
    setTimeout(() => speakText(text, rate, voiceName), 300);
    return;
  }

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = Number(rate);

  const voice = voices.find(v => v.name === voiceName);
  if (voice) utter.voice = voice;

  // 読み上げ終了後の処理（ここだけ MP3 を流す）
  utter.onend = function() {
    new Audio(`${currentNavigator}_3.mp3`).play();

    document.getElementById("emotionSection").style.display = "block";
    document.getElementById("navigatorText").textContent =
      "その時の気持ちを選んでね。";
  };

  speechSynthesis.speak(utter);
}

/* 読み上げボタン（MP3と競合しない完全版） */
document.getElementById("readEventBtn").onclick = function() {
  const text = document.getElementById("eventInput").value;
  const rate = document.getElementById("rateSelect").value;
  const voiceName = document.getElementById("voiceSelect").value;

  // 読み上げ前に MP3 を絶対に再生しない
  speakText(text, rate, voiceName);
};

</script>


</body>
</html>
