<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292; /* ← ほんのり薄ピンク */
  overflow: hidden;

  /* ここから追加 */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハート画像は固定・前面 */
.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2; /* 前面に固定 */
}

/* 黒い幕は背面で上昇 */
.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1; /* 背面に配置 */
  transition: height 0.3s ease;
}


.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #666;
}

.nav-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #333;
  color: #eee;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
.nav-btn:hover {
  background: #555;
}

.index-btn {
  display: inline-block;
  width: 32px;
  height: 32px;
  margin: 4px;
  background: #444;
  color: #eee;
  border-radius: 6px;
  text-align: center;
  line-height: 32px;
  cursor: pointer;
}
.index-btn:hover {
  background: #666;
}

</style>
</head>

<body>
<div class="container">

<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask" alt="">
  <div class="black-curtain"></div>
</div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<!-- ▼ ナビゲーター選択 ▼ -->
<div id="navigatorSelect" style="margin-top:20px;">
  <p>ナビゲーターを選択してください。</p>

  <button class="nav-btn" onclick="selectNavigator('henoj')">変なおじさん</button>
  <button class="nav-btn" onclick="selectNavigator('sensei')">男性教諭</button>
  <button class="nav-btn" onclick="selectNavigator('onei')">おねえ</button>
  <button class="nav-btn" onclick="selectNavigator('mama')">ママ</button>
</div>

<!-- ▼ 質問表示欄 ▼ -->
<div id="navigatorText" style="margin-top:20px; font-size:16px;"></div>

<!-- ▼ 不快指数（最初は非表示） ▼ -->
<div id="indexSection" style="margin-top:20px; display:none;">
  <div id="indexButtons"></div>
</div>

<!-- ▼ 出来事入力欄（最初は非表示） ▼ -->
<div id="eventSection" style="margin-top:20px; display:none;">
  <p>何があったのか、ここに描き出してみて。</p>
  <textarea id="eventInput" rows="4" style="width:100%;"></textarea>

  <!-- 読み上げ設定 -->
  <div style="margin-top:10px;">
    <label>声の種類：</label>
    <select id="voiceSelect"></select>

    <label>速さ：</label>
    <input type="range" id="rateSelect" min="0.5" max="2" step="0.1" value="1">
  </div>

  <!-- 読み上げボタン -->
  <button id="readEventBtn">読み上げる</button>
</div>

<!-- ▼ 気持ち選択欄（最初は非表示） ▼ -->
<div id="emotionSection" style="margin-top:20px; display:none;">
  <p>その時の気持ちを選んでね。</p>
  <select id="emotionSelect">
    <option value="">選択してください</option>
    <option value="怒り">怒り</option>
    <option value="悲しみ">悲しみ</option>
    <option value="不安">不安</option>
    <option value="後悔">後悔</option>
    <option value="混乱">混乱</option>
    <option value="孤独">孤独</option>
  </select>
</div>


<script>

function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}

// 声一覧を読み込む
function loadVoices() {
  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";
  const voices = speechSynthesis.getVoices();

  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name;
    select.appendChild(opt);
  });
}

// ブラウザによっては非同期なのでイベントも付ける
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// 数字を押したときに出来事欄を表示（ここで呼ぶ）
function onSelectIndex(value) {
  new Audio(`${currentNavigator}_2.mp3`).play();

  document.getElementById("navigatorText").textContent =
    "何があったのか教えて？";

  document.getElementById("eventSection").style.display = "block";
}

// 読み上げボタン
document.getElementById("readEventBtn").onclick = function() {
  const text = document.getElementById("eventInput").value;
  const rate = document.getElementById("rateSelect").value;
  const voiceName = document.getElementById("voiceSelect").value;

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = Number(rate);

  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.name === voiceName);
  if (voice) utter.voice = voice;

  speechSynthesis.speak(utter);

  // 読み上げ後のナビゲーター音声（質問3）
  new Audio(`${currentNavigator}_3.mp3`).play();

  // 気持ち選択欄を表示
  document.getElementById("emotionSection").style.display = "block";
  document.getElementById("navigatorText").textContent =
    "その時の気持ちを選んでね。";
};
</script>


</body>
</html>
