<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>
<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292; /* ← ほんのり薄ピンク */
  overflow: hidden;

  /* ここから追加 */
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハート画像は固定・前面 */
.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2; /* 前面に固定 */
}

/* 黒い幕は背面で上昇 */
.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1; /* 背面に配置 */
  transition: height 0.3s ease;
}


.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #666;
}

.nav-btn {
  width: 90%;
  margin: 6px 0;
  padding: 10px;
  background: #444;
  color: #eee;
  border-radius: 8px;
  cursor: pointer;
}
.nav-btn:hover {
  background: #666;
}


</style>
</head>

<body>
<div class="container">

<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask" alt="">
  <div class="black-curtain"></div>
</div>

  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<!-- ← この下に非表示ボタンを置く -->
<button id="hideHeartBtn" onclick="toggleHeart()" 
  style="margin-top:20px; padding:8px; background:#222; color:#eee; border-radius:6px;">
  ハートを非表示にする
</button>

<!-- ▼ ナビゲーター選択ボタン ▼ -->
<div class="navigator-block" style="margin-top:25px;">
  <p>ナビゲーターを選んでください</p>

  <button class="nav-btn" onclick="selectNavigator('ossan')">変なおっさん</button>
  <button class="nav-btn" onclick="selectNavigator('teacher')">男性教諭</button>
  <button class="nav-btn" onclick="selectNavigator('onee')">おねえ</button>
  <button class="nav-btn" onclick="selectNavigator('mama')">ママ</button>
</div>

<script>

function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}

function toggleHeart() {
  const wrapper = document.querySelector('.heart-wrapper');
  const btn = document.getElementById('hideHeartBtn');

  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'flex';
    btn.textContent = 'ハートを非表示にする';
  } else {
    wrapper.style.display = 'none';
    btn.textContent = 'ハートを表示する';
  }
}

let navigatorType = null;

function selectNavigator(type) {
  navigatorType = type;

  let prefix = "";
  switch(type) {
    case "ossan": prefix = "えーっとさ、ちょっと聞くけどさ。"; break;
    case "teacher": prefix = "では、状況を教えてください。"; break;
    case "onee": prefix = "ねえねえ、どうしたのよ〜。"; break;
    case "mama": prefix = "どうしたの、話してごらん。"; break;
  }

  const utter = new SpeechSynthesisUtterance(prefix + "何かあった？大丈夫？");
  speechSynthesis.speak(utter);

  // 次のステップ（出来事入力）を表示する場所
  // ここに dekigoto.html の内容を追加していく
}
</script>


</body>
</html>
