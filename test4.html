<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>感情記録アプリ</title>

<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

/* --- ハート部分 --- */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #ff6b81;
  color: #fff;
}

/* --- セクション共通 --- */
.section {
  opacity: 0;
  transition: opacity 0.3s ease;
}

.section.visible {
  opacity: 1;
}


.section textarea,
.section input,
.section select {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
}
.emotion-btn {
  display: inline-block;
  margin: 4px;
  padding: 6px 12px;
  border: 1px solid #666;
  border-radius: 6px;
  cursor: pointer;
  background: #f9f9f9;
}
 .selected { background: #333; color: rgb(176, 77, 77); }
</style>
</head>

<body>
<div class="container">

<!-- ハート -->
<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask">
  <div class="black-curtain"></div>
</div>

<!-- 声の種類とスピード -->
<div style="margin-top:10px;">
  <label>声の種類</label>
  <select id="voice_select"></select>

  <label>読み上げスピード</label>
  <input id="voice_speed" type="number" min="0.5" max="2" step="0.1" value="1">
</div>

<!-- 数字ボタン -->
<div class="numbers">
  <div class="num-btn" onclick="selectNum(0)">0</div>
  <div class="num-btn" onclick="selectNum(1)">1</div>
  <div class="num-btn" onclick="selectNum(2)">2</div>
  <div class="num-btn" onclick="selectNum(3)">3</div>
  <div class="num-btn" onclick="selectNum(4)">4</div>
  <div class="num-btn" onclick="selectNum(5)">5</div>
  <div class="num-btn" onclick="selectNum(6)">6</div>
  <div class="num-btn" onclick="selectNum(7)">7</div>
  <div class="num-btn" onclick="selectNum(8)">8</div>
  <div class="num-btn" onclick="selectNum(9)">9</div>
  <div class="num-btn" onclick="selectNum(10)">10</div>
</div>

<!-- 不快指数 -->
<div style="margin-top:20px;">
  不快指数（0〜10）  
  <input id="discomfort_input" type="number" min="0" max="10">

  <button onclick="setDiscomfortStart()">不快指数：始め</button>
  <button onclick="setDiscomfortEnd()">不快指数：終わり</button>
</div>

<!-- 出来事 -->
<section>
  <h2>出来事</h2>
  <label>出来事を入力してください</label>
  <textarea id="event"></textarea>
  <button onclick="readContent('event')">出来事を読み上げる</button>
</section>

<p><strong>どんな気持ちだった？選んでみて。</strong></p>
<div id="emotionArea">
  <span class="emotion-btn" onclick="toggleEmotion(this)">怒り</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">不安</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">悲しみ</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">イライラ</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">孤独</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">罪悪感</span>
</div>

<input type="text" id="emotionAdd" placeholder="感情を追加">
<button onclick="addEmotion()">追加</button>

<hr>

<!-- 小説のように気持ちを表現 -->
<p><strong>その時の気持ちを、小説みたいに表現してみて？</strong></p>
<textarea id="feelingText" rows="3" cols="40"></textarea>

<hr>

<!-- 身体の変化 -->
<p><strong>今この時を思い出して、体にはどんな変化があった？</strong></p>
<textarea id="bodyText" rows="3" cols="40"></textarea>

<hr>

<!-- 読み上げ設定 -->
<p><strong>読み上げ設定</strong></p>
<label>速度：</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

<label>声：</label>
<select id="voiceSelect"></select>

<label>BGM：</label>
<select id="bgmSelect">
  <option value="">なし</option>
  <option value="calm.mp3">落ち着く音</option>
  <option value="soft.mp3">やわらかい音</option>
</select>

<hr>

<!-- 読み上げ -->
<button onclick="readAll()">全部読み上げる</button>


<script>

/*ハート*/
function selectNum(n) {
  const curtain = document.querySelector('.black-curtain');
  curtain.style.height = (n * 10) + '%';
}
/*気持ちのセレクト*/
let selectedEmotions = [];
let voices = [];

function toggleEmotion(el) {
  const emotion = el.textContent;
  if (selectedEmotions.includes(emotion)) {
    selectedEmotions = selectedEmotions.filter(e => e !== emotion);
    el.classList.remove("selected");
  } else {
    selectedEmotions.push(emotion);
    el.classList.add("selected");
  }
}

function addEmotion() {
  const add = document.getElementById("emotionAdd").value.trim();
  if (add) {
    const area = document.getElementById("emotionArea");
    const span = document.createElement("span");
    span.className = "emotion-btn";
    span.textContent = add;
    span.onclick = function() { toggleEmotion(span); };
    area.appendChild(span);
    document.getElementById("emotionAdd").value = "";
  }
}

function loadVoices() {
  voices = speechSynthesis.getVoices();
  const select = document.getElementById("voiceSelect");
  voices.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = v.name;
    select.appendChild(opt);
  });
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function readAll() {
  const emotions = selectedEmotions.join("、");
  const feeling = document.getElementById("feelingText").value;
  const body = document.getElementById("bodyText").value;
  const rate = document.getElementById("rate").value;
  const voiceIndex = document.getElementById("voiceSelect").value;

  const text =
    `${emotions}を感じていて、${feeling}という気持ちがあって、体は「${body}」。なるほど、十分味わえた所で、この感情を今、手放しますか？`;

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = rate;
  utter.voice = voices[voiceIndex];

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}
</script>

</body>
</html>
