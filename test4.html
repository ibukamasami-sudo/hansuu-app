<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>感情記録アプリ</title>

<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

/* --- ハート部分 --- */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #ff6b81;
  color: #fff;
}

/* --- セクション共通 --- */
.section {
  opacity: 0;
  transition: opacity 0.3s ease;
}

.section.visible {
  opacity: 1;
}


.section textarea,
.section input,
.section select {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
}
#emotion {
  padding: 8px;
  min-height: 40px;
  border: 1px solid #ccc;
  background: #fafafa;
  margin-top: 6px;
  white-space: pre-wrap;
  color: #333;
}
</style>
</head>

<body>
<div class="container">

<!-- ハート -->
<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask">
  <div class="black-curtain"></div>
</div>

<!-- 声の種類とスピード -->
<div style="margin-top:10px;">
  <label>声の種類</label>
  <select id="voice_select"></select>

  <label>読み上げスピード</label>
  <input id="voice_speed" type="number" min="0.5" max="2" step="0.1" value="1">
</div>

<!-- 数字ボタン -->
<div class="numbers">
  <div class="num-btn" onclick="selectNum(0)">0</div>
  <div class="num-btn" onclick="selectNum(1)">1</div>
  <div class="num-btn" onclick="selectNum(2)">2</div>
  <div class="num-btn" onclick="selectNum(3)">3</div>
  <div class="num-btn" onclick="selectNum(4)">4</div>
  <div class="num-btn" onclick="selectNum(5)">5</div>
  <div class="num-btn" onclick="selectNum(6)">6</div>
  <div class="num-btn" onclick="selectNum(7)">7</div>
  <div class="num-btn" onclick="selectNum(8)">8</div>
  <div class="num-btn" onclick="selectNum(9)">9</div>
  <div class="num-btn" onclick="selectNum(10)">10</div>
</div>

<!-- 不快指数 -->
<div style="margin-top:20px;">
  不快指数（0〜10）  
  <input id="discomfort_input" type="number" min="0" max="10">

  <button onclick="setDiscomfortStart()">不快指数：始め</button>
  <button onclick="setDiscomfortEnd()">不快指数：終わり</button>
</div>

<!-- 出来事 -->
<section>
  <h2>出来事</h2>
  <label>出来事を入力してください</label>
  <textarea id="event"></textarea>
  <button onclick="readContent('event')">出来事を読み上げる</button>
</section>

<!-- 気持ち -->
<section>
  <h2>気持ち</h2>

 <p><strong>どんな気持ちだった？選んでみて。</strong></p>
<div id="emotionArea">
  <span class="emotion-btn" onclick="toggleEmotion(this)">怒り</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">不安</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">悲しみ</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">イライラ</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">孤独</span>
  <span class="emotion-btn" onclick="toggleEmotion(this)">罪悪感</span>
</div>

<input type="text" id="emotionAdd" placeholder="感情を追加">
<button onclick="addEmotion()">追加</button>

</section>

<!-- 小説風 -->
<section>
  <h2>小説風</h2>
  <label>小説風に書いてください</label>
  <textarea id="story"></textarea>
  <button onclick="readContent('story')">小説風に読み上げる</button>
</section>

<!-- 身体感覚 -->
<section>
  <h2>身体感覚</h2>
  <label>身体感覚を入力してください</label>
  <textarea id="body"></textarea>
  <button onclick="readContent('body')">身体感覚を読み上げる</button>
</section>

<!-- 最後にまとめて読み上げる -->
<section>
  <button onclick="readAll()">全部まとめて読み上げる</button>
</section>

<!-- ★★★ 第二章：案内文＋ボタン（ここから書く） ★★★ -->
<div id="chapter2_intro" style="display:none;">
  <p>
    この出来事からこの気持ちを持つのは、自然なことです。<br>
    何度も聞いて、味わい尽くしてください。<br>
    必要に応じて、BGMも選べます。<br>
    内容に違和感があれば書き換えることもできます。<br>
    十分に味わえたら、納得ボタンを押してください。
  </p>

  <button id="btn_replay">もう一度聞く</button>
  <button id="btn_show_inputs">入力欄を再表示する</button>
    <div id="chapter2_reopen" style="display:none;">
    <button class="reopen-btn" data-target="event">出来事</button>
    <button class="reopen-btn" data-target="emotion">気持ち</button>
    <button class="reopen-btn" data-target="story">小説風</button>
    <button class="reopen-btn" data-target="body">身体感覚</button>
    </div>
  <button id="btn_agree">納得する</button>

  <!-- BGM選択 -->
  <select id="bgm_select">
    <option value="">BGMなし</option>
    <option value="bgm1.mp3">やさしいピアノ</option>
    <option value="bgm2.mp3">静かなギター</option>
    <option value="bgm3.mp3">雨の音</option>
  </select>
  <button id="btn_play_bgm">BGMを流す</button>
  <button id="btn_stop_bgm">停止</button>
</div>

<script>
  let selectedEmotions = [];
let voices = [];

function toggleEmotion(el) {
  const emotion = el.textContent;
  if (selectedEmotions.includes(emotion)) {
    selectedEmotions = selectedEmotions.filter(e => e !== emotion);
    el.classList.remove("selected");
  } else {
    selectedEmotions.push(emotion);
    el.classList.add("selected");
  }
}

function addEmotion() {
  const add = document.getElementById("emotionAdd").value.trim();
  if (add) {
    const area = document.getElementById("emotionArea");
    const span = document.createElement("span");
    span.className = "emotion-btn";
    span.textContent = add;
    span.onclick = function() { toggleEmotion(span); };
    area.appendChild(span);
    document.getElementById("emotionAdd").value = "";
  }
}


/* ★★★ 声の読み込み（必須） ★★★ */
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (voices.length > 0) fillVoiceList();
}

speechSynthesis.onvoiceschanged = loadVoices;
window.onload = loadVoices;

/* 声リストをUIに入れる */
function fillVoiceList() {
  const sel = document.getElementById("voice_select");
  sel.innerHTML = "";
  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name;
    sel.appendChild(opt);
  });
}

/* 数字ボタン：黒幕＋不快指数 */
function selectNum(n) {
  document.querySelector('.black-curtain').style.height = (n * 10) + '%';
  document.getElementById("discomfort_input").value = n;

  document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('active'));
  const clicked = document.querySelector(`.num-btn:nth-child(${n + 1})`);
  if (clicked) clicked.classList.add('active');
}

let discomfortStart = null;
let discomfortEnd = null;

/* ★★★ ハートの表示／非表示 ★★★ */
function toggleHeart() {
  const wrapper = document.querySelector('.heart-wrapper');
  const btn = document.getElementById('hideHeartBtn');

  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'flex';
    btn.textContent = 'ハートを非表示にする';
  } else {
    wrapper.style.display = 'none';
    btn.textContent = 'ハートを表示する';
  }
}

/* セクション順序（ここだけで管理） */
const sections = ["event", "emotion", "story", "body", "summary", "end"];


/* 次のセクションへ */
function showNextSection(current) {
  const nextIndex = sections.indexOf(current) + 1;
  if (nextIndex < sections.length) {
    showSection(sections[nextIndex]);
  }
}

/* セクション表示 */
function showSection(name) {
  document.getElementById("section_" + name).classList.add("visible");
}


/* 不快指数：始め */
function setDiscomfortStart() {
  discomfortStart = Number(document.getElementById("discomfort_input").value);
  showSection("event");
}

/* 不快指数：終わり */
function setDiscomfortEnd() {
  discomfortEnd = Number(document.getElementById("discomfort_input_end").value);
}

// 気持ちの統合
function updateEmotion() {
  const emo = document.getElementById("emotion_select").value;
  const extra = document.getElementById("emotion_extra").value;

  const finalEmotion = emo + (extra ? "、" + extra : "");
  document.getElementById("emotion").textContent = finalEmotion;
}

const templates = {
  event: "出来事は「{text}」",
  emotion: "気持ちは「{text}」",
  story: "小説風に言うと「{text}」",
  body: "身体感覚は「{text}」"
};

/* 読み上げ中フラグ */
let isSpeaking = false;

let parts = [];

const getValue = id => {
  const el = document.getElementById(id);
  return el?.value || el?.textContent || "";
};

function readContent(type) {
  if (isSpeaking) return;
  isSpeaking = true;

  let sentence = "";

  if (type === "summary") {
    const startValue = getValue("discomfort_input");
    sentence =
      "不快指数は「" + startValue + "」。" +
      "出来事は「" + getValue("event") + "」。" +
      "気持ちは「" + getValue("emotion") + "」。" +
      "小説風では「" + getValue("story") + "」。" +
      "身体感覚は「" + getValue("body") + "」。";
  } else {
    const text = getValue(type);
    sentence = templates[type].replace("{text}", text);
    parts[type] = sentence; // ←ここを変更
  }

  speakText(sentence, type);
}

function speakText(text, type) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = Number(document.getElementById("voice_speed").value);

  const selectedName = document.getElementById("voice_select").value;
  const selectedVoice = voices.find(v => v.name === selectedName);
  if (selectedVoice) utter.voice = selectedVoice;

  utter.onend = () => {
    isSpeaking = false;
    showNextSection(type);
  };

  speechSynthesis.speak(utter);
}

function readAll() {
  const finalText = parts.join("。") + "。";
  speakText(finalText);
}

/* 再表示ボタン */
document.querySelectorAll('.reopen-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.target;
    document.getElementById("section_" + target).style.display = "block";
  });
});

/* BGM再生 */

let bgmAudio = null;

document.getElementById("btn_play_bgm").onclick = () => {
  const file = document.getElementById("bgm_select").value;
  if (!file) return;

  if (bgmAudio) bgmAudio.pause();
  bgmAudio = new Audio(file);
  bgmAudio.loop = true;
  bgmAudio.play();
};

document.getElementById("btn_stop_bgm").onclick = () => {
  if (bgmAudio) bgmAudio.pause();
};



/* 終わりの不快指数 */
function finishDiscomfort() {
  discomfortEnd = Number(document.getElementById("discomfort_input_end").value);
  showSection("save");
}

/* 記録保存 */
function saveRecord() {
  const today = new Date().toISOString().split("T")[0];

  const record = {
    date: today,
    event: getValue("event"),
    emotion: getValue("emotion"),
    emotion_extra: getValue("emotion_extra"),
    story: getValue("story"),
    body: getValue("body"),
    discomfortStart,
    discomfortEnd
  };

  let records = JSON.parse(localStorage.getItem("records") || "[]");
  records.push(record);
  localStorage.setItem("records", JSON.stringify(records));

  document.getElementById("records_view").textContent =
    JSON.stringify(records, null, 2);
}



</script>

</body>
</html>
