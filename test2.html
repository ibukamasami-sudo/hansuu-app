<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>感情記録アプリ</title>

<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

/* --- ハート部分 --- */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

.num-btn.active {
  background: #ff6b81;
  color: #fff;
}

/* --- セクション共通 --- */
.section {
  opacity: 0;
  transition: opacity 0.3s ease;
}

.section.visible {
  opacity: 1;
}


.section textarea,
.section input,
.section select {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
}
</style>
</head>

<body>
<div class="container">

<!-- ハート -->
<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask">
  <div class="black-curtain"></div>
</div>

<!-- 声の種類とスピード -->
<div style="margin-top:10px;">
  <label>声の種類</label>
  <select id="voice_select"></select>

  <label>読み上げスピード</label>
  <input id="voice_speed" type="number" min="0.5" max="2" step="0.1" value="1">
</div>

<!-- 数字ボタン -->
<div class="numbers">
  <div class="num-btn" onclick="selectNum(0)">0</div>
  <div class="num-btn" onclick="selectNum(1)">1</div>
  <div class="num-btn" onclick="selectNum(2)">2</div>
  <div class="num-btn" onclick="selectNum(3)">3</div>
  <div class="num-btn" onclick="selectNum(4)">4</div>
  <div class="num-btn" onclick="selectNum(5)">5</div>
  <div class="num-btn" onclick="selectNum(6)">6</div>
  <div class="num-btn" onclick="selectNum(7)">7</div>
  <div class="num-btn" onclick="selectNum(8)">8</div>
  <div class="num-btn" onclick="selectNum(9)">9</div>
  <div class="num-btn" onclick="selectNum(10)">10</div>
</div>

<!-- 不快指数 -->
<div style="margin-top:20px;">
  不快指数（0〜10）  
  <input id="discomfort_input" type="number" min="0" max="10">

  <button onclick="setDiscomfortStart()">不快指数：始め</button>
  <button onclick="setDiscomfortEnd()">不快指数：終わり</button>
</div>

<!-- 出来事 -->
<div id="section_event" class="section">
  <div>きっかけになった出来事を入力してください</div>
  <textarea id="input_event"></textarea>
  <button onclick="readContent('event')">出来事を読み上げる</button>
</div>

<!-- 気持ち（選択式＋補足） -->
<div id="section_emotion" class="section">
  <div>その時の気持ちを選んでください</div>

  <select id="emotion_select">
    <option value="">選択してください</option>
    <option value="怒り">怒り</option>
    <option value="悲しみ">悲しみ</option>
    <option value="不安">不安</option>
    <option value="後悔">後悔</option>
    <option value="混乱">混乱</option>
    <option value="孤独">孤独</option>
  </select>

  <div style="margin-top:6px;">補足（自由入力）</div>
  <textarea id="emotion_extra"></textarea>

  <button onclick="readContent('emotion')">気持ちを読み上げる</button>
</div>

<!-- 小説風 -->
<div id="section_story" class="section">
  <div>小説風に言語化してください</div>
  <textarea id="input_story"></textarea>
  <button onclick="readContent('story')">小説風を読み上げる</button>
</div>

<!-- 身体感覚 -->
<div id="section_body" class="section">
  <div>身体感覚を入力してください</div>
  <textarea id="input_body"></textarea>
  <button onclick="readContent('body')">身体感覚を読み上げる</button>
</div>

<!-- 全部まとめて読み上げ -->
<div id="section_summary" class="section">
  <button onclick="readContent('summary')">全てつなげて読み上げる</button>
</div>

<!-- 終わりの不快指数 -->
<div id="section_end" class="section">
  今の不快指数を入力してください  
  <input id="discomfort_input_end" type="number" min="0" max="10">
  <button onclick="finishDiscomfort()">終わりを記録する</button>
</div>

<!-- 記録 -->
<div id="section_save" class="section">
  記録しますか？
  <button onclick="saveRecord()">記録する</button>
</div>

<!-- 保存された記録 -->
<pre id="records_view" style="margin-top:20px;"></pre>

</div>

<script>

/* ★★★ 声の読み込み（必須） ★★★ */
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (voices.length > 0) fillVoiceList();
}

speechSynthesis.onvoiceschanged = loadVoices;
window.onload = loadVoices;

/* 声リストをUIに入れる */
function fillVoiceList() {
  const sel = document.getElementById("voice_select");
  sel.innerHTML = "";
  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name;
    sel.appendChild(opt);
  });
}

/* 数字ボタン：黒幕＋不快指数 */
function selectNum(n) {
  document.querySelector('.black-curtain').style.height = (n * 10) + '%';
  document.getElementById("discomfort_input").value = n;

  document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('active'));
  const clicked = document.querySelector(`.num-btn:nth-child(${n + 1})`);
  if (clicked) clicked.classList.add('active');
}

let discomfortStart = null;
let discomfortEnd = null;

/* ★★★ ハートの表示／非表示 ★★★ */
function toggleHeart() {
  const wrapper = document.querySelector('.heart-wrapper');
  const btn = document.getElementById('hideHeartBtn');

  if (wrapper.style.display === 'none') {
    wrapper.style.display = 'flex';
    btn.textContent = 'ハートを非表示にする';
  } else {
    wrapper.style.display = 'none';
    btn.textContent = 'ハートを表示する';
  }
}

/* セクション順序（ここだけで管理） */
const sections = ["event", "emotion", "story", "body", "summary", "end"];

/* 次のセクションへ */
function showNextSection(current) {
  const nextIndex = sections.indexOf(current) + 1;
  if (nextIndex < sections.length) {
    showSection(sections[nextIndex]);
  }
}

/* セクション表示 */
function showSection(name) {
  document.getElementById("section_" + name).classList.add("visible");
}

/* 不快指数：始め */
function setDiscomfortStart() {
  discomfortStart = Number(document.getElementById("discomfort_input").value);
  showSection("event");
}

/* 不快指数：終わり */
function setDiscomfortEnd() {
  discomfortEnd = Number(document.getElementById("discomfort_input_end").value);
}

/* 入力値を取る共通関数 */
const getValue = name => document.getElementById("input_" + name)?.value || "";

/* 読み上げ中フラグ */
let isSpeaking = false;

/* セクション読み上げ（短い版） */
function readContent(type) {
  if (isSpeaking) return;
  isSpeaking = true;

  let text = "";

  if (type === "summary") {
    const startValue = document.getElementById("discomfort_input").value;

    text =
      "不快指数は「" + startValue + "」。" +
      "出来事は「" + getValue("event") + "」。" +
      "気持ちは「" + getValue("emotion") + "」。補足は「" + getValue("emotion_extra") + "」。" +
      "小説風では「" + getValue("story") + "」。" +
      "身体感覚は「" + getValue("body") + "」。";
  } else {
    text = getValue(type);
  }

  speakText(text, type);
}

/* 読み上げ共通処理 */
function speakText(text, type) {
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = Number(document.getElementById("voice_speed").value);

  const selectedName = document.getElementById("voice_select").value;
  const selectedVoice = voices.find(v => v.name === selectedName);
  if (selectedVoice) utter.voice = selectedVoice;

  utter.onend = () => {
    isSpeaking = false;
    showNextSection(type);
  };

  speechSynthesis.speak(utter);
}

/* 終わりの不快指数 */
function finishDiscomfort() {
  discomfortEnd = Number(document.getElementById("discomfort_input_end").value);
  showSection("save");
}

/* 記録保存 */
function saveRecord() {
  const today = new Date().toISOString().split("T")[0];

  const record = {
    date: today,
    event: getValue("event"),
    emotion: getValue("emotion"),
    emotion_extra: getValue("emotion_extra"),
    story: getValue("story"),
    body: getValue("body"),
    discomfortStart,
    discomfortEnd
  };

  let records = JSON.parse(localStorage.getItem("records") || "[]");
  records.push(record);
  localStorage.setItem("records", JSON.stringify(records));

  document.getElementById("records_view").textContent =
    JSON.stringify(records, null, 2);
}

</script>

</body>
</html>
