<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>感情記録アプリ</title>

<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
}

/* --- ハート部分（Masamiさんのデザインそのまま） --- */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

/* --- セクション共通 --- */
.section {
  display: none;
  margin-top: 20px;
  text-align: left;
}

.section textarea,
.section input {
  width: 100%;
  padding: 6px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  margin-top: 10px;
  padding: 6px 10px;
}
</style>
</head>

<body>
<div class="container">

<!-- ハート -->
<div class="heart-wrapper">
  <img src="heart-mask.png" class="heart-mask">
  <div class="black-curtain"></div>
</div>

<div class="numbers">
  <div class="num-btn" onclick="selectNum(0)">0</div>
  <div class="num-btn" onclick="selectNum(1)">1</div>
  <div class="num-btn" onclick="selectNum(2)">2</div>
  <div class="num-btn" onclick="selectNum(3)">3</div>
  <div class="num-btn" onclick="selectNum(4)">4</div>
  <div class="num-btn" onclick="selectNum(5)">5</div>
  <div class="num-btn" onclick="selectNum(6)">6</div>
  <div class="num-btn" onclick="selectNum(7)">7</div>
  <div class="num-btn" onclick="selectNum(8)">8</div>
  <div class="num-btn" onclick="selectNum(9)">9</div>
  <div class="num-btn" onclick="selectNum(10)">10</div>
</div>

<!-- 不快指数 -->
<div style="margin-top:20px;">
  不快指数（0〜10）  
  <input id="discomfort_input" type="number" min="0" max="10">

  <button onclick="setDiscomfortStart()">不快指数：始め</button>
  <button onclick="setDiscomfortEnd()">不快指数：終わり</button>
</div>

<!-- 出来事 -->
<div id="section_event" class="section">
  <div>きっかけになった出来事を入力してください</div>
  <textarea id="input_event"></textarea>
  <button onclick="readContent('event')">出来事を読み上げる</button>
</div>

<!-- 気持ち -->
<div id="section_emotion" class="section">
  <div>その時の気持ちを入力してください</div>
  <input id="input_emotion" type="text">
  <button onclick="readContent('emotion')">気持ちを読み上げる</button>
</div>

<!-- 小説風 -->
<div id="section_story" class="section">
  <div>小説風に言語化してください</div>
  <textarea id="input_story"></textarea>
  <button onclick="readContent('story')">小説風を読み上げる</button>
</div>

<!-- 身体感覚 -->
<div id="section_body" class="section">
  <div>身体感覚を入力してください</div>
  <textarea id="input_body"></textarea>
  <button onclick="readContent('body')">身体感覚を読み上げる</button>
</div>

<!-- 全部まとめて読み上げ -->
<div id="section_summary" class="section">
  <button onclick="readContent('summary')">全てつなげて読み上げる</button>
</div>

<!-- 終わりの不快指数 -->
<div id="section_end" class="section">
  今の不快指数を入力してください  
  <input id="discomfort_input_end" type="number" min="0" max="10">
  <button onclick="finishDiscomfort()">終わりを記録する</button>
</div>

<!-- 記録 -->
<div id="section_save" class="section">
  記録しますか？
  <button onclick="saveRecord()">記録する</button>
</div>

<!-- 保存された記録 -->
<pre id="records_view" style="margin-top:20px;"></pre>

</div>

<script>
let discomfortStart = null;
let discomfortEnd = null;

/* ハートの黒幕 */
function selectNum(n) {
  document.querySelector('.black-curtain').style.height = (n * 10) + '%';
}

/* 不快指数：始め */
function setDiscomfortStart() {
  discomfortStart = Number(document.getElementById("discomfort_input").value);
  showSection("event");
}

/* 不快指数：終わり */
function setDiscomfortEnd() {
  discomfortEnd = Number(document.getElementById("discomfort_input_end").value);
}

/* セクション切り替え */
function showSection(name) {
  document.querySelectorAll('.section').forEach(sec => sec.style.display = "none");
  document.getElementById("section_" + name).style.display = "block";
}

/* 読み上げ（1つだけ） */
function readContent(type) {
  let text = "";

  if (type === "event") {
    text = document.getElementById("input_event").value;
    showSection("emotion");
  }
  else if (type === "emotion") {
    text = document.getElementById("input_emotion").value;
    showSection("story");
  }
  else if (type === "story") {
    text = document.getElementById("input_story").value;
    showSection("body");
  }
  else if (type === "body") {
    text = document.getElementById("input_body").value;
    showSection("summary");
  }
  else if (type === "summary") {
    text =
      "出来事は「" + document.getElementById("input_event").value + "」。" +
      "気持ちは「" + document.getElementById("input_emotion").value + "」。" +
      "小説風では「" + document.getElementById("input_story").value + "」。" +
      "身体感覚は「" + document.getElementById("input_body").value + "」。";
    showSection("end");
  }

  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

/* 終わりの不快指数 */
function finishDiscomfort() {
  discomfortEnd = Number(document.getElementById("discomfort_input_end").value);
  showSection("save");
}

/* 記録保存（1つだけ） */
function saveRecord() {
  const today = new Date().toISOString().split("T")[0];

  const record = {
    date: today,
    event: input_event.value,
    emotion: input_emotion.value,
    story: input_story.value,
    body: input_body.value,
    discomfortStart,
    discomfortEnd
  };

  let records = JSON.parse(localStorage.getItem("records") || "[]");
  records.push(record);
  localStorage.setItem("records", JSON.stringify(records));

  document.getElementById("records_view").textContent =
    JSON.stringify(records, null, 2);
}
</script>

</body>
</html>
