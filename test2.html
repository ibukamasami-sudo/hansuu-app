<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Heart Curtain Test</title>

<style>
body {
  background: #aaa;
  color: #eee;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 40px;
}

.container {
  width: 300px;
  text-align: center;
  margin-bottom: 20px;
}

#stepMessage,
#eventSection,
#emotionSection,
#storySection {
  width: 300px;
  text-align: left;
}

/* ハートの枠 */
.heart-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  background: #ec9292;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハート画像（前面） */
.heart-mask {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
}

/* 黒い幕（背面） */
.black-curtain {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: black;
  opacity: 0.8;
  z-index: 1;
  transition: height 0.3s ease;
}

/* 数字ボタン */
.numbers {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.num-btn {
  width: 28px;
  height: 28px;
  background: #333;
  border-radius: 6px;
  text-align: center;
  line-height: 28px;
  cursor: pointer;
}

/* 気持ちタグ */
.emotion-tag {
  display: inline-block;
  background: #444;
  color: #eee;
  padding: 5px 10px;
  margin: 4px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <!-- ハート -->
  <div class="heart-wrapper">
    <img src="heart-mask.png" class="heart-mask" alt="">
    <div class="black-curtain"></div>
  </div>

  <!-- 数値ボタン -->
  <div class="numbers">
    <div class="num-btn" onclick="selectNum(0)">0</div>
    <div class="num-btn" onclick="selectNum(1)">1</div>
    <div class="num-btn" onclick="selectNum(2)">2</div>
    <div class="num-btn" onclick="selectNum(3)">3</div>
    <div class="num-btn" onclick="selectNum(4)">4</div>
    <div class="num-btn" onclick="selectNum(5)">5</div>
    <div class="num-btn" onclick="selectNum(6)">6</div>
    <div class="num-btn" onclick="selectNum(7)">7</div>
    <div class="num-btn" onclick="selectNum(8)">8</div>
    <div class="num-btn" onclick="selectNum(9)">9</div>
    <div class="num-btn" onclick="selectNum(10)">10</div>
  </div>

</div>

<!-- メッセージ欄 -->
<div id="stepMessage" style="margin-top:20px; font-size:16px;">
  不快感の数値を選んでください。
</div>

<!-- 出来事欄 -->
<div id="eventSection" style="margin-top:20px; display:none;">
  <textarea id="eventInput" rows="4" style="width:100%;"></textarea>

  <div style="margin-top:10px;">
    <label>声：</label>
    <select id="voiceSelect"></select>

    <label>速さ：</label>
    <input type="range" id="rateSelect" min="0.5" max="2" step="0.1" value="1">
  </div>

  <button id="readEventBtn">読み上げる</button>
</div>

<!-- 気持ち欄 -->
<div id="emotionSection" style="margin-top:20px; display:none;">

  <select id="emotionSelect">
    <option value="">選択してください</option>
    <option value="怒り">怒り</option>
    <option value="悲しみ">悲しみ</option>
    <option value="不安">不安</option>
    <option value="後悔">後悔</option>
    <option value="混乱">混乱</option>
    <option value="孤独">孤独</option>
  </select>
  <button id="addEmotionBtn">追加</button>

  <input id="customEmotion" type="text" placeholder="気持ちを追加する">
  <button id="customEmotionBtn">追加する</button>

  <div id="emotionList" style="margin-top:10px;"></div>

  <button id="readEmotionBtn">気持ちを読み上げる</button>
</div>

<!-- 小説風欄 -->
<div id="storySection" style="margin-top:20px; display:none;">
  <textarea id="storyInput" rows="5" style="width:100%;"></textarea>
</div>

<script>
/* ============================
   不快指数 → ハートアニメ＋出来事欄
============================ */
function selectNum(n) {
  document.querySelector('.black-curtain').style.height = (n * 10) + '%';

  document.getElementById("stepMessage").textContent =
    "きっかけを書き出してください。";

  document.getElementById("eventSection").style.display = "block";
}

/* ============================
   声一覧
============================ */
function loadVoices() {
  const select = document.getElementById("voiceSelect");
  select.innerHTML = "";
  speechSynthesis.getVoices().forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name;
    select.appendChild(opt);
  });
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

/* ============================
   共通読み上げ
============================ */
function speakText(text, onEnd = null) {
  const rate = Number(document.getElementById("rateSelect").value);
  const voiceName = document.getElementById("voiceSelect").value;

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = rate;

  const voice = speechSynthesis.getVoices().find(v => v.name === voiceName);
  if (voice) utter.voice = voice;

  if (onEnd) utter.onend = onEnd;

  speechSynthesis.speak(utter);
}

/* ============================
   出来事 → 気持ち
============================ */
document.getElementById("readEventBtn").onclick = () => {
  const text = document.getElementById("eventInput").value;

  speakText(text, () => {
    document.getElementById("stepMessage").textContent =
      "気持ちを選んでください。";

    document.getElementById("emotionSection").style.display = "block";
  });
};

/* ============================
   気持ち選択
============================ */
let selectedEmotions = [];

document.getElementById("addEmotionBtn").onclick = () => {
  const v = document.getElementById("emotionSelect").value;
  if (v && !selectedEmotions.includes(v)) {
    selectedEmotions.push(v);
    renderEmotionTags();
  }
};

document.getElementById("customEmotionBtn").onclick = () => {
  const v = document.getElementById("customEmotion").value.trim();
  if (v && !selectedEmotions.includes(v)) {
    selectedEmotions.push(v);
    document.getElementById("customEmotion").value = "";
    renderEmotionTags();
  }
};

function renderEmotionTags() {
  const list = document.getElementById("emotionList");
  list.innerHTML = "";
  selectedEmotions.forEach(e => {
    const tag = document.createElement("span");
    tag.className = "emotion-tag";
    tag.textContent = e;
    tag.onclick = () => {
      selectedEmotions = selectedEmotions.filter(x => x !== e);
      renderEmotionTags();
    };
    list.appendChild(tag);
  });
}

/* ============================
   気持ち → 小説風
============================ */
document.getElementById("readEmotionBtn").onclick = () => {
  const text = selectedEmotions.join("、");

  speakText(text, () => {
    document.getElementById("stepMessage").textContent =
      "その時の気持ちを、小説のように詳しく言語化してください。";

    document.getElementById("storySection").style.display = "block";
  });
};
</script>

</body>
</html>
