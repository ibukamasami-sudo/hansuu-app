<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>反芻ストップ試作</title>

<style>
body {
  background:#aaa;
  font-family:'Segoe UI',sans-serif;
  color:#222;
  text-align:center;
  padding:30px;
}

/* 入力欄 */
textarea {
  width:90%;
  height:100px;
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  border:1px solid #666;
  background:#eee;
}

/* ドロップボタン */
select {
  margin:8px;
  padding:8px 12px;
  border-radius:6px;
  border:none;
  background:#444;
  color:#fff;
  cursor:pointer;
}

/* ボタン */
button {
  margin:12px;
  padding:10px 20px;
  border-radius:6px;
  border:none;
  background:#333;
  color:#fff;
  cursor:pointer;
  transition: background 0.2s;
}

/* クリック時に色が変わる */
button:active {
  background:#666;
}
button:hover {
  background:#555;
}
</style>
</head>

<body>

<h2>反芻ストップ試作</h2>

<textarea id="happeningText" placeholder="今日のハプニングを書く"></textarea><br>

<!-- 質問の音声 -->
<label>質問の音声：</label>
<select id="voiceChoice">
  <option value="hennakoe.mp3">大丈夫？何があったの？</option>
  <option value="yasashiku.mp3">やさしい声</option>
  <option value="bakappoi.mp3">バカっぽい声</option>
</select><br>

<!-- 読み上げ速度 -->
<label>読み上げ速度：</label>
<select id="rateChoice" onchange="setRate(this.value)">
  <option value="0.8">ゆっくり読む（0.8）</option>
  <option value="1.0">やさしく読む（1.0）</option>
  <option value="1.3">すっきり読む（1.3）</option>
  <option value="1.4">ちょっとバカっぽく読む（1.4）</option>
</select><br>

<!-- 読み上げの声（ブラウザの音声） -->
<label>読み上げの声：</label>
<select id="readVoiceSelect">
  <option value="">読み込み中…</option>
</select><br>

<!-- BGM -->
<label>BGM：</label>
<select id="bgmChoice">
  <option value="">BGMなし</option>
  <option value="bgm1.mp3">静かなBGM</option>
  <option value="bgm2.mp3">軽いBGM</option>
  <option value="bgm3.mp3">少し不安なBGM</option>
</select><br>

<button onclick="playSequence()">読み上げる</button>

<audio id="bgm" loop></audio>

<script>
let currentRate = 1.3;
let voices = [];

/* 読み上げ速度 */
function setRate(rate){
  currentRate = Number(rate);
}

/* ブラウザの音声一覧を読み込む */
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const select = document.getElementById("readVoiceSelect");
  select.innerHTML = "";

  voices.forEach((v, i) => {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = `${v.name}（${v.lang}）`;
    select.appendChild(option);
  });
}

speechSynthesis.onvoiceschanged = loadVoices;

/* 質問の音声 → ハプニング読み上げ */
function playSequence(){
  const voiceFile = document.getElementById("voiceChoice").value;
  const bgmFile = document.getElementById("bgmChoice").value;

  const bgm = document.getElementById("bgm");

  // BGMファイルがある時だけ再生
  if(bgmFile){
    bgm.src = bgmFile;
    bgm.volume = 0.3;
    bgm.play().catch(()=>{});
  }

  // 質問の音声
  const audio = new Audio(voiceFile);
  audio.play();

  audio.onended = () => {
    readText();
  };
}

/* ハプニング読み上げ（声選択対応） */
function readText(){
  const text = document.getElementById("happeningText").value;
  const voiceIndex = document.getElementById("readVoiceSelect").value;

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = currentRate;
  utter.pitch = 1.2;

  if (voices[voiceIndex]) {
    utter.voice = voices[voiceIndex];
  }

  utter.onend = () => {
    const bgm = document.getElementById("bgm");
    bgm.pause();
  };

  speechSynthesis.speak(utter);
}
</script>

</body>
</html>
