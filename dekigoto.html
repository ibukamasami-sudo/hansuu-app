<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>反芻ストップ試作</title>
<style>
body {
  background:#aaa;
  font-family:'Segoe UI',sans-serif;
  color:#222;
  text-align:center;
  padding:30px;
}
textarea {
  width:90%;
  height:100px;
  margin:10px 0;
  padding:10px;
  border-radius:8px;
  border:1px solid #666;
  background:#eee;
}
select,button {
  margin:8px;
  padding:8px 12px;
  border-radius:6px;
  border:none;
  background:#333;
  color:#fff;
  cursor:pointer;
}
select {
  background:#444;
}
button:hover {
  background:#555;
}
</style>
</head>
<body>

<h2>反芻ストップ試作</h2>

<textarea id="happeningText" placeholder="今日のハプニングを書く"></textarea><br>

<label>質問の音声：</label>
<select id="voiceChoice">
  <option value="hennakoe.mp3">大丈夫？何があったの？</option>
  <option value="yasashiku.mp3">やさしい声</option>
  <option value="bakappoi.mp3">バカっぽい声</option>
</select><br>

<label>読み上げ速度：</label>
<select id="rateChoice" onchange="setRate(this.value)">
  <option value="0.8">ゆっくり読む（0.8）</option>
  <option value="1.0">やさしく読む（1.0）</option>
  <option value="1.3">すっきり読む（1.3）</option>
  <option value="1.4">ちょっとバカっぽく読む（1.4）</option>
</select><br>

<label>BGM：</label>
<select id="bgmChoice">
  <option value="bgm1.mp3">静かなBGM</option>
  <option value="bgm2.mp3">軽いBGM</option>
  <option value="bgm3.mp3">少し不安なBGM</option>
</select><br>

<button onclick="playSequence()">読み上げる</button>

<audio id="bgm" loop></audio>

<script>
let currentRate = 1.3;

function setRate(rate){
  currentRate = Number(rate);
}

function playSequence(){
  const voiceFile = document.getElementById("voiceChoice").value;
  const bgmFile = document.getElementById("bgmChoice").value;
  const bgm = document.getElementById("bgm");
  bgm.src = bgmFile;
  bgm.volume = 0.3;
  bgm.play();

  const audio = new Audio(voiceFile);
  audio.play();

  audio.onended = () => {
    readText();
  };
}

function readText(){
  const text = document.getElementById("happeningText").value;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = currentRate;
  utter.pitch = 1.2;
  utter.onend = () => {
    document.getElementById("bgm").pause();
  };
  speechSynthesis.speak(utter);
}
</script>

</body>
</html>
